name: Deploy Lambda Functions

on:
  push:
    branches: [main]
    paths:
      - 'lambda/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deploy submitDoc
        run: |
          cd lambda/submitDoc
          npm ci
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name submitDoc \
            --zip-file fileb://function.zip

      - name: Deploy discussApi
        run: |
          cd lambda/discussApi
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name discussApi \
            --zip-file fileb://function.zip

      # Uses the SDK bundled with the Node.js runtime; nothing to install.
      - name: Deploy weeklyReport
        run: |
          cd lambda/weeklyReport
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name weeklyReport \
            --zip-file fileb://function.zip
