<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Light or dark before the first paint: the saved choice (src/components/theme.js), else
         the device setting. The stylesheet reads data-theme on <html>; without this the page
         would flash light for a dark-mode reader on every load. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('psm-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#01202C" />
    <meta
      name="description"
      content="High quality, community-built gouge for naval aviation training"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>PSM</title>
  </head>
  <body>
    <noscript>High quality, community buiilt gouge for naval aviation training</noscript>
    <!-- Hidden duplicate of the React feedback form so Netlify's build bot
         registers the form and its fields. Keep field names in sync with
         src/components/Footer.js -->
    <form name="feedback" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <select name="category"></select>
      <input type="email" name="email" />
      <textarea name="description"></textarea>
      <input type="file" name="photo1" />
      <input type="file" name="photo2" />
      <input type="file" name="photo3" />
    </form>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
